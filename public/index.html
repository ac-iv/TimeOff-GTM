<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time off · Global TekMed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#0d8cc7; --blue-deep:#06416c; --blue-mid:#046fa5;
    --ink:#0a0a0a; --body:#3d444d; --muted:#767f8a;
    --line:#e4e8ec; --line-2:#eef1f4; --tint:#f4f8fb;
    --amber:#946a12; --red:#b3261e;
  }
  *{box-sizing:border-box}
  #app{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--body);
    background:#fff;min-height:100%;-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
  .wrap{max-width:1020px;margin:0 auto;padding:0 22px 72px}

  /* banner */
  .banner{background:#fdf0ef;border-bottom:1px solid #f3d5d2;color:var(--red);
    font-size:13.5px;padding:10px 22px;text-align:center}

  /* login */
  .login{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:44px 22px}
  .login-card{width:100%;max-width:380px}
  .login-card img.lockup{width:206px;height:auto;display:block;margin:0 auto 32px}
  .login-card h1,.login-card .sub{text-align:center}
  .login-card .sub{margin:0 auto 26px}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 24px}
  .tabs button{flex:1;font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;
    border:0;border-bottom:2px solid transparent;padding:10px 4px 11px;margin-bottom:-1px;cursor:pointer}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
  .foot button{font:inherit;font-size:13px;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
  .foot button:hover{text-decoration:underline}

  /* header */
  header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
  .hbar{max-width:1020px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .hbar img{width:29px;height:29px;display:block}
  .hbar .brand{font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:700;font-size:15.5px;
    letter-spacing:-.02em;color:var(--ink)}
  .nav{display:flex;gap:2px;margin-left:14px;margin-right:auto;flex-wrap:wrap}
  .nav button{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;
    padding:7px 11px;border-radius:8px;cursor:pointer}
  .nav button[aria-current="page"]{color:var(--ink);background:var(--tint)}
  .hbar .you{color:var(--muted);font-size:13.5px}
  .link{font:inherit;font-size:13.5px;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
  .link:hover{text-decoration:underline}

  /* type */
  h1{font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.035em;
    font-size:29px;color:var(--ink);margin:0 0 7px;line-height:1.15}
  h2{font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;letter-spacing:-.02em;
    font-size:16.5px;color:var(--ink);margin:0}
  h3{font-family:'Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:14px;color:var(--ink);
    margin:0 0 12px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:15px;margin:0 0 28px;max-width:58ch}
  .page-top{padding:38px 0 0}

  /* panels */
  .grid{display:grid;grid-template-columns:1.02fr .98fr;gap:22px;align-items:start}
  .panel{border:1px solid var(--line);border-radius:14px;padding:22px}
  .panel + .panel{margin-top:22px}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:19px}
  .panel-head p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  .sep{border:0;border-top:1px solid var(--line-2);margin:22px 0}

  /* form */
  label{display:block;font-size:13px;color:var(--body);font-weight:500;margin:0 0 6px}
  input,select,textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;
    border:1px solid #dfe4e9;border-radius:9px;padding:10px 12px;outline:none}
  input::placeholder,textarea::placeholder{color:#a8b0b9}
  textarea{resize:vertical;min-height:66px}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(13,140,199,.14)}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:15px}
  .hint{font-size:12.5px;color:var(--muted);margin:-9px 0 15px}

  .seg{display:flex;gap:4px;background:var(--line-2);border-radius:10px;padding:4px;margin-bottom:18px}
  .seg button{flex:1;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);background:none;
    border:0;padding:8px;border-radius:7px;cursor:pointer}
  .seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}

  .count{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);
    border:1px solid #dbe8f2;border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:14px;color:var(--blue-mid)}
  .count b{font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:18px;color:var(--blue-deep);letter-spacing:-.02em}
  .count.idle{background:#fff;border-color:var(--line);color:var(--muted)}
  .count.idle b{color:#c3c9d0}
  .count.bad{background:#fdf8ee;border-color:#f0e2c4;color:var(--amber)}
  .count.bad b{color:var(--amber)}

  .btn{font:inherit;font-weight:600;font-size:14.5px;color:#fff;cursor:pointer;background:var(--blue);
    border:1px solid var(--blue);border-radius:9px;padding:11px 18px;width:100%}
  .btn:hover{background:#0a7bb0;border-color:#0a7bb0}
  .btn.sm{width:auto;padding:8px 14px;font-size:13.5px}
  .btn.plain{background:#fff;color:var(--ink);border-color:#dfe4e9}
  .btn.plain:hover{background:#f7f9fb;border-color:#cfd6dd}
  .btn.danger{background:#fff;color:var(--red);border-color:#f0d3d1}
  .btn.danger:hover{background:#fdf6f5;border-color:#e5b8b4}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* pool */
  .pool{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px}
  .pool-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:14px}
  .pool-row:last-child{border-bottom:0}
  .pool-row .d{color:var(--ink);font-weight:500}
  .pool-row .t{color:var(--muted);font-size:13.5px}
  .pool-row .h{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--blue-mid);font-weight:600;font-size:13.5px}
  .x{font:inherit;font-size:17px;line-height:1;color:#b6bec7;background:none;border:0;cursor:pointer;padding:0 2px}
  .x:hover{color:var(--red)}
  .pool-total{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
    background:var(--tint);font-size:13.5px;color:var(--blue-mid);font-weight:500}
  .pool-total b{font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:16px;color:var(--blue-deep)}

  /* requests */
  .list{display:flex;flex-direction:column;gap:10px}
  .req{border:1px solid var(--line);border-radius:11px;padding:14px 16px}
  .req-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .who{font-weight:600;font-size:14.5px;color:var(--ink)}
  .when{color:var(--muted);font-size:13.5px}
  .pill{margin-left:auto;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px}
  .pill.pending{background:#fdf6e7;color:var(--amber)}
  .pill.approved{background:var(--tint);color:var(--blue-mid)}
  .pill.denied{background:#fdf0ef;color:var(--red)}
  .pill.mixed{background:var(--line-2);color:var(--body)}
  .lines{margin-top:10px;border-top:1px solid var(--line-2)}
  .line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px;flex-wrap:wrap}
  .line:last-child{border-bottom:0}
  .line .d{color:var(--ink)}
  .line .t,.line .h{color:var(--muted);font-size:13.5px}
  .line .h{font-variant-numeric:tabular-nums}
  .line .sp{margin-left:auto;display:flex;gap:7px;align-items:center}
  .meta{color:var(--muted);font-size:13.5px;margin-top:7px}
  .meta em{font-style:normal;color:var(--body)}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .actions input{flex:1;min-width:170px;padding:8px 12px;font-size:13.5px}
  .warn{margin-top:8px;font-size:13.5px;color:var(--amber)}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}

  /* roster */
  .roster{border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .rrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
  .rrow:last-child{border-bottom:0}
  .rrow .n{font-weight:600;color:var(--ink);font-size:14.5px}
  .rrow .e{color:var(--muted);font-size:13.5px}
  .rrow .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .rrow .reset{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--tint);border-radius:9px;padding:10px 12px;margin-top:4px}
  .rrow .reset input{flex:1;min-width:160px;padding:8px 12px;font-size:13.5px;background:#fff}
  .tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:#fdf6e7;color:var(--amber)}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .cal-head h2{margin-right:auto}
  .nav-btn{font:inherit;font-size:15px;line-height:1;color:var(--body);background:#fff;border:1px solid var(--line);
    border-radius:8px;width:32px;height:32px;cursor:pointer}
  .nav-btn:hover{background:#f7f9fb}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);
    border-radius:12px;overflow:hidden}
  .dow{padding:8px 9px;font-size:12px;font-weight:600;color:var(--muted);background:#fafbfc;
    border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell{min-height:96px;padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
  .cell.out{background:#fafbfc}
  .cell.wknd{background:#fbfcfd}
  .cell .num{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:5px}
  .cell.today .num{color:#fff;background:var(--blue);border-radius:999px;display:inline-block;
    min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}
  .cell.out .num{color:#c3c9d0}
  .chip{display:block;font-size:11.5px;line-height:1.35;padding:3px 6px;border-radius:5px;margin-bottom:3px;
    background:var(--tint);color:var(--blue-deep);border-left:2px solid var(--blue);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .chip.part{background:#fff8ec;color:#7a570e;border-left-color:#d9a53c}
  .cal-key{display:flex;gap:16px;margin-top:12px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
  .key{display:flex;align-items:center;gap:6px}
  .sw{width:11px;height:11px;border-radius:3px;background:var(--tint);border-left:2px solid var(--blue)}
  .sw.part{background:#fff8ec;border-left-color:#d9a53c}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-bottom:22px}
  .stat{padding:16px 18px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat b{display:block;font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:25px;letter-spacing:-.035em;
    color:var(--ink);line-height:1.15}
  .stat span{color:var(--muted);font-size:13px}
  .filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .filters button{font:inherit;font-size:13.5px;color:var(--muted);background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer}
  .filters button[aria-pressed="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}
  .err{color:var(--red);font-size:13.5px;margin-top:11px}
  .ok{color:var(--blue-mid);font-size:13.5px;margin-top:11px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);
    color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;z-index:60;max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:860px){
    .grid{grid-template-columns:1fr}
    h1{font-size:24px}
    .stats{grid-template-columns:1fr}
    .stat{border-right:0;border-bottom:1px solid var(--line)}
    .stat:last-child{border-bottom:0}
    .cell{min-height:74px}
    .chip{font-size:10.5px}
    .nav{width:100%;margin:6px 0 0;order:5}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const fb   = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fb);
const db   = getFirestore(fb);
const fns  = getFunctions(fb, REGION);

let state = {
  user:null, isAdmin:false, profile:null, ready:false, booting:true,
  cfg:{ fullDay:8, notifyEmails:[] },
  requests:{}, people:[], admins:[],
  authTab:"in", page:"request", filter:"pending",
  mode:"full", pool:[], calMonth:null, busy:false, notice:null
};
let unsubs=[];

/* ---------- dates & hours ---------- */
const d = s => { const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); };
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
const fmt = s => d(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtY = s => d(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
const isWknd = dt => dt.getDay()===0 || dt.getDay()===6;
function workdays(a,b){
  if(!a||!b) return 0;
  let s=d(a), e=d(b), n=0;
  if(e<s) return 0;
  while(s<=e){ if(!isWknd(s)) n++; s.setDate(s.getDate()+1); }
  return n;
}
const mins = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
function fmtTime(t){ let [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12;
  return m ? `${h}:${String(m).padStart(2,"0")} ${ap}` : `${h} ${ap}`; }
const bare = t => fmtTime(t).replace(/ (AM|PM)/,"");
const trim = n => (Math.round(n*100)/100).toString();
const blockHours = b => b.kind==="full" ? workdays(b.start,b.end)*state.cfg.fullDay : (mins(b.to)-mins(b.from))/60;
const blockLabel = b => b.kind==="full"
  ? (b.start===b.end ? fmtY(b.start) : fmtY(b.start)+" to "+fmtY(b.end)) : fmtY(b.start);
const blockDetail = b => b.kind==="full"
  ? `${workdays(b.start,b.end)} full day${workdays(b.start,b.end)===1?"":"s"}`
  : `${fmtTime(b.from)} to ${fmtTime(b.to)}`;
function coversDay(b,dayStr){
  const day=d(dayStr);
  if(b.kind==="partial") return b.start===dayStr;
  return d(b.start)<=day && day<=d(b.end) && !isWknd(day);
}

/* ---------- helpers ---------- */
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3600);
}
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = n => { const p=String(n||"").trim().split(/\s+/); return p.length>1 ? p[0]+" "+p[1][0]+"." : p[0]; };
const first = n => String(n||"").trim().split(/\s+/)[0];
const val = id => (document.getElementById(id)?.value ?? "").trim();
const reqList = () => Object.values(state.requests).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
const statusOf = r => { const s=new Set(r.blocks.map(b=>b.status)); return s.size===1?[...s][0]:"mixed"; };
const label = s => s==="pending"?"Waiting":s==="approved"?"Approved":s==="denied"?"Denied":"Partly approved";
const authMsg = e => ({
  "auth/email-already-in-use":"An account already exists for that email. Sign in instead.",
  "auth/invalid-email":"That email doesn't look right.",
  "auth/weak-password":"Passwords need at least 6 characters.",
  "auth/invalid-credential":"That email and password don't match.",
  "auth/wrong-password":"That email and password don't match.",
  "auth/user-not-found":"No account for that email yet.",
  "auth/too-many-requests":"Too many tries. Wait a minute and try again.",
  "auth/network-request-failed":"Network problem. Check your connection."
}[e?.code] || "Something went wrong. Try again.");

/* ---------- live data ---------- */
function stopFeeds(){ unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; }
function startFeeds(){
  stopFeeds();
  state.requests={};
  const take = snap => {
    snap.docChanges().forEach(c=>{
      if(c.type==="removed") delete state.requests[c.doc.id];
      else state.requests[c.doc.id]={id:c.doc.id, ...c.doc.data()};
    });
    render();
  };
  if(state.isAdmin){
    unsubs.push(onSnapshot(collection(db,"requests"), take, err=>fail(err)));
    unsubs.push(onSnapshot(collection(db,"users"), s=>{
      state.people=s.docs.map(x=>({uid:x.id,...x.data()})); render();
    }, ()=>{}));
    unsubs.push(onSnapshot(collection(db,"admins"), s=>{
      state.admins=s.docs.map(x=>({uid:x.id,...x.data()})); render();
    }, ()=>{}));
  }else{
    unsubs.push(onSnapshot(query(collection(db,"requests"),where("uid","==",state.user.uid)), take, err=>fail(err)));
    unsubs.push(onSnapshot(query(collection(db,"requests"),where("anyApproved","==",true)), take, err=>fail(err)));
  }
  unsubs.push(onSnapshot(doc(db,"config","app"), s=>{
    if(s.exists()) state.cfg=Object.assign({fullDay:8,notifyEmails:[]}, s.data());
    render();
  }, ()=>{}));
}
function fail(err){
  console.error(err);
  state.notice="Couldn't reach the database. Check your connection, then reload.";
  render();
}

onAuthStateChanged(auth, async u=>{
  state.booting=false;
  if(!u){ stopFeeds(); state.user=null; state.isAdmin=false; state.ready=true; return render(); }
  state.user=u;
  try{
    const admin=await getDoc(doc(db,"admins",u.uid));
    state.isAdmin=admin.exists();
    const prof=await getDoc(doc(db,"users",u.uid));
    state.profile = prof.exists() ? prof.data() : {name:u.displayName||u.email, email:u.email};
    if(!prof.exists()){
      await setDoc(doc(db,"users",u.uid),{name:state.profile.name,email:u.email,createdAt:Date.now()});
    }
  }catch(e){ console.error(e); }
  state.ready=true;
  state.page="request";
  startFeeds();
  render();
});

/* ---------- render ---------- */
function render(){
  const v=document.getElementById("view");
  if(state.booting){ v.innerHTML=`<div class="login"><div class="login-card"><img class="lockup" src="${LOCKUP}" alt="Global TekMed Holdings"></div></div>`; return; }
  if(!state.user){ v.innerHTML=authView(); wireAuth(); return; }
  if(!state.ready){ v.innerHTML=shell(`<div class="page-top"><div class="empty">Loading…</div></div>`); return; }
  let body;
  if(state.page==="calendar") body=calendarView();
  else if(state.page==="settings") body=state.isAdmin?settingsView():accountView();
  else if(state.isAdmin) body=queueView();
  else if(state.page==="mine") body=mineView();
  else body=requestView();
  v.innerHTML=shell(body);
  if(!state.isAdmin && state.page==="request") wireBuilder();
}
function shell(inner){
  const pages = state.isAdmin
    ? [["request","Approval queue"],["calendar","Team calendar"],["settings","Settings"]]
    : [["request","Request time off"],["mine","My requests"],["calendar","Team calendar"],["settings","Account"]];
  return `${state.notice?`<div class="banner">${esc(state.notice)}</div>`:""}
    <header><div class="hbar">
      <img src="${MARK}" alt="Global TekMed">
      <span class="brand">Time off</span>
      <nav class="nav">${pages.map(([id,t])=>
        `<button ${state.page===id?'aria-current="page"':""} data-go="${id}">${t}</button>`).join("")}</nav>
      <span class="you">${esc(state.isAdmin?"Manager":short(state.profile?.name||state.user.email))}</span>
      <button class="link" data-act="signout">Sign out</button>
    </div></header><div class="wrap">${inner}</div>`;
}

async function signup(){
  const name=val("s-name"), email=val("s-email").toLowerCase(), pass=val("s-pass");

  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});

async function resetSelf(){
  const email=val("f-email").toLowerCase();

function wireBuilder(){
  const box=document.getElementById("b-count");
  const recount=()=>{
    if(state.mode==="full"){
      const s=val("b-start"), e=val("b-end");
      if(!s||!e){ box.className="count idle"; box.innerHTML=`<span>Pick your dates</span><b>0</b>`; return; }
      if(d(e)<d(s)){ box.className="count bad"; box.innerHTML=`<span>The last day is before the first</span><b>0</b>`; return; }
      const n=workdays(s,e);
      if(!n){ box.className="count bad"; box.innerHTML=`<span>That range is all weekend</span><b>0</b>`; return; }
      box.className="count"; box.innerHTML=`<span>${n} working day${n===1?"":"s"}</span><b>${trim(n*state.cfg.fullDay)} hours</b>`;
    }else{
      const dt=val("b-date"), f=val("b-from"), t=val("b-to");
      if(!dt||!f||!t){ box.className="count idle"; box.innerHTML=`<span>Pick your date and times</span><b>0</b>`; return; }
      const h=(mins(t)-mins(f))/60;
      if(h<=0){ box.className="count bad"; box.innerHTML=`<span>Back time has to be after leaving time</span><b>0</b>`; return; }
      box.className="count"; box.innerHTML=`<span>${fmtTime(f)} to ${fmtTime(t)}</span><b>${trim(h)} hours</b>`;
    }
  };
  ["b-start","b-end","b-date","b-from","b-to"].forEach(id=>{
    const el=document.getElementById(id);
    if(el){ el.addEventListener("change",recount); el.addEventListener("input",recount); }
  });
  const s=document.getElementById("b-start");
  if(s) s.addEventListener("change",()=>{
    const e=document.getElementById("b-end");
    e.min=s.value; if(e.value && e.value<s.value) e.value=s.value; recount();
  });
}
function readForm(quiet){
  const say=m=>{ if(!quiet) toast(m); return null; };
  if(state.mode==="full"){
    const s=val("b-start"), e=val("b-end");
    if(!s&&!e) return quiet?null:say("Pick a first and last day.");
    if(!s||!e) return say("Pick both a first and a last day.");
    if(d(e)<d(s)) return say("The last day is before the first day.");
    if(!workdays(s,e)) return say("That range is all weekend. Pick at least one working day.");
    return {kind:"full",start:s,end:e,from:null,to:null};
  }
  const dt=val("b-date"), f=val("b-from"), t=val("b-to");
  if(!dt) return quiet?null:say("Pick a date.");
  if(isWknd(d(dt))) return say("That date is a weekend.");
  if(mins(t)<=mins(f)) return say("Back time has to be after leaving time.");
  return {kind:"partial",start:dt,end:dt,from:f,to:t};
}
function addToPool(){
  const b=readForm(false); if(!b) return;
  state.pool.push(b); toast("Added. Fill in the next block or hit send."); render();
}
async function sendRequest(){
  if(state.busy) return;
  const note=val("b-note");
  const pending=[...state.pool];
  const fromForm=readForm(true);
  if(fromForm) pending.push(fromForm);
  if(!pending.length) return toast("Fill in a date first, then send.");

  const blocks=pending.map(b=>({...b, hours:blockHours(b), status:"pending", decidedNote:"", decidedAt:null}));
  state.busy=true; render();
  try{
    await addDoc(collection(db,"requests"),{
      uid:state.user.uid,
      name:state.profile?.name || state.user.displayName || state.user.email,
      email:state.user.email,
      blocks, note, anyApproved:false, status:"pending",
      hours:blocks.reduce((n,b)=>n+b.hours,0),
      createdAt:Date.now(), createdAtServer:serverTimestamp()
    });
    state.pool=[]; state.page="mine";
    toast(`Request sent. ${blocks.length} block${blocks.length===1?"":"s"}, ${trim(blocks.reduce((n,b)=>n+b.hours,0))} hours. Your manager has been emailed.`);
  }catch(e){
    console.error(e);
    state.pool=pending;
    toast("Couldn't send that. Check your connection and try again.");
  }
  state.busy=false; render();
}

function reqCard(r){
  const st=statusOf(r), open=r.blocks.some(b=>b.status==="pending");
  return `<div class="req">
    <div class="req-top">
      <span class="who">${esc(r.name)}</span>

    </div>
    ${r.note?`<div class="meta"><em>${esc(r.note)}</em></div>`:""}
    <div class="lines">${r.blocks.map((b,i)=>{
      const clash=clashes(r,b);
      return `<div class="line">
        <span class="d">${blockLabel(b)}</span><span class="t">${blockDetail(b)}</span>
        <span class="h">${trim(b.hours)}h</span>
        <span class="sp">${b.status==="pending"
          ? `<button class="btn sm" data-act="decide" data-k="${r.id}" data-k2="${i}" data-s="approved">Approve</button>
             <button class="btn sm plain" data-act="decide" data-k="${r.id}" data-k2="${i}" data-s="denied">Deny</button>`
          : `<span class="pill ${b.status}" style="margin:0">${label(b.status)}</span>
             <button class="btn sm plain" data-act="decide" data-k="${r.id}" data-k2="${i}" data-s="pending">Undo</button>`}</span>
        ${clash.length?`<div class="warn" style="flex-basis:100%">${clash.join(" and ")} already approved for the same day.</div>`:""}
      </div>`;}).join("")}</div>
    ${open?`<div class="actions">
      <input id="n_${r.id}" placeholder="Note back to ${esc(first(r.name))} (goes in the email)">
      <button class="btn sm" data-act="decideall" data-k="${r.id}" data-s="approved">Approve all</button>
      <button class="btn sm plain" data-act="decideall" data-k="${r.id}" data-s="denied">Deny all</button>
    </div>`:""}

function clashes(req,block){
  const out=[];
  reqList().forEach(r=>{
    if(r.id===req.id || r.uid===req.uid) return;
    r.blocks.forEach(b=>{
      if(b.status==="approved" && d(b.start)<=d(block.end) && d(block.start)<=d(b.end)) out.push(esc(r.name));
    });
  });
  return [...new Set(out)];
}
async function decide(id,idxs,status,note){
  const r=state.requests[id]; if(!r) return;
  const blocks=r.blocks.map((b,i)=> idxs.includes(i)
    ? {...b, status, decidedAt: status==="pending"?null:Date.now(), decidedNote: status==="pending" ? "" : (note||b.decidedNote||"")}
    : b);
  const anyApproved=blocks.some(b=>b.status==="approved");
  const set=new Set(blocks.map(b=>b.status));
  try{
    await updateDoc(doc(db,"requests",id),{
      blocks, anyApproved, status:set.size===1?[...set][0]:"mixed",
      decidedBy:state.user.email, decidedAt:Date.now()
    });
    toast(status==="approved"?"Approved. Email sent.":status==="denied"?"Denied. Email sent.":"Moved back to waiting");
  }catch(e){ console.error(e); toast("Couldn't save that decision. Try again."); }
}
async function decideAll(id,status){
  const r=state.requests[id]; if(!r) return;
  const note=(document.getElementById("n_"+id)?.value||"").trim();
  const idxs=r.blocks.map((b,i)=>b.status==="pending"?i:-1).filter(i=>i>=0);
  if(idxs.length) await decide(id,idxs,status,note);
}

/* ---------- employee account ---------- */
function accountView(){
  return `<div class="page-top">
    <h1>Your account</h1>
    <p class="sub">Signed in as ${esc(state.user.email)}.</p>
    <div class="panel" style="max-width:440px">
      <h3>Change password</h3>
      <div class="field"><label for="p-old">Current password</label><input id="p-old" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="p-new">New password</label><input id="p-new" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
      <button class="btn" data-act="changepass">Save password</button>
      <div class="err" id="p-err" hidden></div>
      <div class="ok" id="p-ok" hidden>Password updated.</div>
    </div>
  </div>`;
}
async function changeOwn(){
  const old=val("p-old"), nu=val("p-new");
  if(nu.length<8) return showErr("p-err","New passwords need at least 8 characters.");
  try{
    await reauthenticateWithCredential(state.user, EmailAuthProvider.credential(state.user.email, old));
    await updatePassword(state.user, nu);
    document.getElementById("p-err").hidden=true;
    document.getElementById("p-ok").hidden=false;
    toast("Password updated");
  }catch(e){ showErr("p-err", e?.code==="auth/invalid-credential" ? "That current password isn't right." : authMsg(e)); }
}

/* ---------- settings ---------- */
function settingsView(){
  const emails=state.cfg.notifyEmails||[];
  const adminUids=new Set(state.admins.map(a=>a.uid));
  return `<div class="page-top">
    <h1>Settings</h1>
    <p class="sub">Who gets notified, who can approve, how long a full day is, and the roster.</p>

    <div class="panel">
      <div class="panel-head"><div><h2>Notification emails</h2><p>${emails.length} of 10 · everyone here gets an email each time a request comes in</p></div></div>
      ${emails.length ? `<div class="roster">${emails.map((e,i)=>`<div class="rrow">
          <div><div class="n">${esc(e)}</div></div>
          <div class="sp"><button class="btn sm danger" data-act="dropnotify" data-k="${i}">Remove</button></div>
        </div>`).join("")}</div>` : `<div class="empty">Nobody is being notified yet. Add at least one address.</div>`}
      <div class="actions">
        <input id="ne" type="email" placeholder="josue@globaltekmed.com" ${emails.length>=10?"disabled":""}>
        <button class="btn sm" data-act="addnotify" ${emails.length>=10?"disabled":""}>Add email</button>
      </div>
      ${emails.length>=10?`<p class="hint" style="margin-top:12px">That's the limit of 10. Remove one to add another.</p>`:""}
    </div>

    <div class="panel">
      <div class="panel-head"><div><h2>People</h2><p>${state.people.length} account${state.people.length===1?"":"s"}</p></div></div>
      ${state.people.length ? `<div class="roster">${state.people.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(u=>{
        const n=reqList().filter(r=>r.uid===u.uid).length, isA=adminUids.has(u.uid);
        return `<div class="rrow">
          <div><div class="n">${esc(u.name||u.email)}</div><div class="e">${esc(u.email)} · ${n} request${n===1?"":"s"}</div></div>
          <div class="sp">
            ${isA?`<span class="tag">Manager</span>`:""}
            <button class="btn sm plain" data-act="sendreset" data-k="${esc(u.email)}">Email a reset link</button>
            ${isA
              ? (u.uid===state.user.uid ? "" : `<button class="btn sm plain" data-act="demote" data-k="${u.uid}">Remove manager</button>`)
              : `<button class="btn sm plain" data-act="promote" data-k="${u.uid}">Make manager</button>`}
            ${u.uid===state.user.uid?"":`<button class="btn sm danger" data-act="removeuser" data-k="${u.uid}" data-name="${esc(u.name||u.email)}">Delete</button>`}
          </div>
        </div>`;}).join("")}</div>` : `<div class="empty">Nobody has created an account yet.</div>`}
      <p class="hint" style="margin-top:14px">A reset link goes straight to their inbox from Firebase. You never see or set their password.</p>
    </div>

    <div class="panel">
      <div class="panel-head"><div><h2>Rules</h2></div></div>
      <div class="field" style="max-width:250px"><label for="c-full">Hours in a full day</label>
        <input id="c-full" type="number" min="1" max="24" step="0.5" value="${state.cfg.fullDay}"></div>
      <button class="btn sm" data-act="saverules">Save changes</button>
      <p class="hint" style="margin-top:14px">Only affects new requests. Ones already sent keep the hours they were sent with.</p>
    </div>
  </div>`;
}
async function addnotify(){
  const e=val("ne").toLowerCase();
  if(!/.+@.+\..+/.test(e)) return toast("That email doesn't look right.");
  const list=[...(state.cfg.notifyEmails||[])];
  if(list.includes(e)) return toast("That address is already on the list.");
  if(list.length>=10) return toast("Ten is the limit. Remove one first.");
  list.push(e);
  try{ await setDoc(doc(db,"config","app"),{...state.cfg,notifyEmails:list},{merge:true}); toast("Added"); }
  catch(err){ toast("Couldn't save. Try again."); }
}
async function dropNotify(i){
  const list=[...(state.cfg.notifyEmails||[])]; list.splice(i,1);
  try{ await setDoc(doc(db,"config","app"),{...state.cfg,notifyEmails:list},{merge:true}); toast("Removed"); }
  catch(err){ toast("Couldn't save. Try again."); }
}
async function saverules(){
  const full=parseFloat(val("c-full"));
  if(!(full>0&&full<=24)) return toast("Hours in a day has to be between 1 and 24.");
  try{ await setDoc(doc(db,"config","app"),{...state.cfg,fullDay:full},{merge:true}); toast("Settings saved"); }
  catch(e){ toast("Couldn't save. Try again."); }
}
async function sendReset(email){
  try{ await sendPasswordResetEmail(auth,email); toast(`Reset link sent to ${email}`); }
  catch(e){ toast("Couldn't send that. Check the address."); }
}
async function promote(uid){
  const u=state.people.find(p=>p.uid===uid); if(!u) return;
  if(!confirm(`Give ${u.name||u.email} manager access? They'll see everyone's requests.`)) return;
  try{ await setDoc(doc(db,"admins",uid),{email:u.email,addedAt:Date.now()}); toast("Manager access on"); }
  catch(e){ toast("Couldn't save. Try again."); }
}
async function demote(uid){
  if(!confirm("Remove manager access for this person?")) return;
  try{ await deleteDoc(doc(db,"admins",uid)); toast("Manager access off"); }
  catch(e){ toast("Couldn't save. Try again."); }
}
async function removeUser(uid,name){
  if(!confirm(`Delete ${name}? Their sign in stops working. Their requests stay in the record.`)) return;
  try{ await httpsCallable(fns,"removeEmployee")({uid}); toast("Account deleted"); }
  catch(e){ console.error(e); toast("Couldn't delete that account."); }
}

/* ---------- team calendar ---------- */
function calendarView(){
  const base = state.calMonth ? d(state.calMonth+"-01") : new Date();
  const y=base.getFullYear(), m=base.getMonth();
  const start=new Date(y,m,1); start.setDate(1-new Date(y,m,1).getDay());
  const todayStr=iso(new Date());
  const approved=[];
  reqList().forEach(r=>r.blocks.forEach(b=>{ if(b.status==="approved") approved.push({...b,name:r.name}); }));
  let cells="";
  for(let i=0;i<42;i++){
    const day=new Date(start); day.setDate(day.getDate()+i);
    const s=iso(day), off=day.getMonth()!==m;
    const on=approved.filter(b=>coversDay(b,s)).sort((a,b)=>a.kind===b.kind?0:a.kind==="full"?-1:1);
    const chips=on.map(b=>`<span class="chip ${b.kind==="partial"?"part":""}" title="${esc(b.name)} · ${blockDetail(b)}">${esc(short(b.name))}${b.kind==="partial"?" "+bare(b.from)+"-"+bare(b.to):""}</span>`).join("");
    cells+=`<div class="cell${off?" out":""}${isWknd(day)?" wknd":""}${s===todayStr?" today":""}"><div class="num">${day.getDate()}</div>${chips}</div>`;
  }
  const dows=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="dow">${x}</div>`).join("");
  return `<div class="page-top">
    <h1>Team calendar</h1>
    <p class="sub">Every approved block, visible to everyone. Pending requests don't show here.</p>
    <div class="panel">
      <div class="cal-head">
        <h2>${new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2>
        <button class="nav-btn" aria-label="Previous month" data-act="prevmonth">‹</button>
        <button class="nav-btn" aria-label="Next month" data-act="nextmonth">›</button>
        <button class="btn sm plain" data-act="thismonth">Today</button>
      </div>
      <div class="cal">${dows}${cells}</div>
      <div class="cal-key">
        <span class="key"><span class="sw"></span> Full day</span>
        <span class="key"><span class="sw part"></span> Part of a day</span>
      </div>
    </div>
  </div>`;
}
function shiftMonth(n){
  const base = state.calMonth ? d(state.calMonth+"-01") : new Date();
  const nd=new Date(base.getFullYear(), base.getMonth()+n, 1);
  state.calMonth=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,"0")}`;
  render();
}

render();
</script>
